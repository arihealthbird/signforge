name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify sign-off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${base}" || true
          fi
          commits=$(git rev-list "${base}..HEAD" 2>/dev/null || echo "")
          if [ -z "$commits" ]; then
            echo "No commits to verify."
            exit 0
          fi
          status=0
          for sha in $commits; do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a 'Signed-off-by:' trailer."
              git show -s --format='%h %s' "$sha"
              status=1
            fi
          done
          exit $status
